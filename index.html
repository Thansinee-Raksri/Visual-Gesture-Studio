<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Visual-Gesture-Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Inter', 'Noto Sans Thai', sans-serif; 
    }
    body {
      background-color: #08080a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      width: 100%;
      height: 100%;
      object-fit: cover; /* ป้องกันภาพถูกบีบหรือยืดบนมือถือ */
    }
    
    /* ซ่อน Scrollbar แถบฟิลเตอร์ */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* แถบควบคุมด้านล่างสไตล์ Floating Glassmorphism Dock รองรับจอมือถือ */
    .controls {
      position: fixed;
      bottom: 24px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      background: rgba(24, 24, 28, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      z-index: 10;
      max-width: 95vw;
      overflow-x: auto;
    }
    
    /* กลุ่มปุ่มเลือกฟิลเตอร์ */
    .filter-group {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 2px;
      flex-shrink: 0;
    }

    .filter-btn {
      width: 28px;
      height: 28px;
      padding: 0;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 600;
      color: #fff;
      flex-shrink: 0;
    }

    .filter-btn.auto { background: conic-gradient(from 45deg, #ff7eb3, #00d2ff, #ffb199, #ff7eb3); }
    .filter-btn.pink { background: #ff7eb3; }
    .filter-btn.blue { background: #00b4d8; }
    .filter-btn.peach { background: #ffaa85; }
    .filter-btn.scanline { background: #00f5d4; color: #000; }
    .filter-btn.matrix { background: #2d6a4f; }
    .filter-btn.grain { background: #b08968; }
    .filter-btn.noir { background: #343a40; border: 1px solid #adb5bd; }

    .filter-btn:hover { transform: scale(1.12); }
    .filter-btn.active {
      border-color: #ffffff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
      transform: scale(1.15);
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: transparent;
      color: rgba(255, 255, 255, 0.85);
      border: none;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      border-radius: 999px;
      transition: all 0.2s ease;
      user-select: none;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .action-btn svg { width: 14px; height: 14px; stroke-width: 2; }
    .action-btn:hover { background: rgba(255, 255, 255, 0.12); color: #ffffff; }
    .action-btn.danger:hover { background: rgba(255, 75, 75, 0.18); color: #ff6b6b; }

    .divider {
      width: 1px;
      height: 20px;
      background: rgba(255, 255, 255, 0.15);
      margin: 0 2px;
      flex-shrink: 0;
    }
    
    button.primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: #ffffff;
      color: #09090b;
      border: none;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 255, 255, 0.15);
      transition: all 0.2s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }
    button.primary svg { width: 14px; height: 14px; stroke-width: 2; }
    button.primary:hover { background: #f4f4f5; transform: translateY(-1px); }
  </style>
</head>
<body>

  <div id="stage">
    <video id="webcam" style="display:none;" autoplay playsinline muted></video>
    <canvas id="canvas" width="1280" height="720"></canvas>
  </div>

  <div class="controls no-scrollbar">
    <!-- แถบเลือกฟิลเตอร์ทั้งหมด 7 แบบ -->
    <div class="filter-group">
      <button class="filter-btn auto active" onclick="setFilter('auto', this)" title="สลับอัตโนมัติ">A</button>
      <button class="filter-btn pink" onclick="setFilter(0, this)" title="พิกเซลชมพู"></button>
      <button class="filter-btn blue" onclick="setFilter(1, this)" title="ไซเบอร์บลู Grid"></button>
      <button class="filter-btn peach" onclick="setFilter(2, this)" title="ส้มพีชละมุน"></button>
      <button class="filter-btn scanline" onclick="setFilter(3, this)" title="เรโทรสแกนไลน์"></button>
      <button class="filter-btn matrix" onclick="setFilter(4, this)" title="ดาร์กซีนีมาติก"></button>
      <button class="filter-btn grain" onclick="setFilter(5, this)" title="ฟิล์มเกรนวินเทจ"></button>
      <button class="filter-btn noir" onclick="setFilter(6, this)" title="โมโนโครมคอนทราสต์"></button>
    </div>

    <div class="divider"></div>

    <button class="action-btn" onclick="undoLast()" title="ย้อนกลับ">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>
      ย้อน
    </button>

    <button class="action-btn danger" onclick="clearFrames()" title="ล้างทั้งหมด">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
      ล้าง
    </button>

    <div class="divider"></div>

    <button class="primary" onclick="downloadPoster()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      บันทึก
    </button>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let capturedFrames = [];
    let isPinching = false;
    let cooldown = false;
    let selectedFilter = 'auto';

    function setFilter(mode, btnElement) {
      selectedFilter = mode;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');
    }

    function getDistance(p1, p2) { return Math.hypot(p1.x - p2.x, p1.y - p2.y); }

    function applyFilterToContext(targetCtx, w, h, styleIndex) {
      const mode = styleIndex % 7;
      const imgData = targetCtx.getImageData(0, 0, w, h);
      const data = imgData.data;

      if (mode === 0) {
        const pixelSize = 6;
        const smallW = Math.max(1, Math.floor(w / pixelSize));
        const smallH = Math.max(1, Math.floor(h / pixelSize));
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = smallW; tempCanvas.height = smallH;
        const tempCtx = tempCanvas.getContext('2d');
        tempCtx.drawImage(targetCtx.canvas, 0, 0, w, h, 0, 0, smallW, smallH);
        const sImg = tempCtx.getImageData(0, 0, smallW, smallH);
        const sData = sImg.data;
        for (let i = 0; i < sData.length; i += 4) {
          let g = (sData[i]*0.3 + sData[i+1]*0.59 + sData[i+2]*0.11);
          g = Math.min(255, g + 20);
          sData[i] = Math.min(255, g * 1.3);
          sData[i+1] = Math.min(255, g * 0.75);
          sData[i+2] = Math.min(255, g * 1.1);
        }
        tempCtx.putImageData(sImg, 0, 0);
        targetCtx.imageSmoothingEnabled = false;
        targetCtx.clearRect(0, 0, w, h);
        targetCtx.drawImage(tempCanvas, 0, 0, smallW, smallH, 0, 0, w, h);
        targetCtx.imageSmoothingEnabled = true;

      } else if (mode === 1) {
        for (let i = 0; i < data.length; i += 4) {
          const avg = (data[i] + data[i+1] + data[i+2]) / 3;
          data[i] = avg * 0.1; data[i+1] = avg * 0.8; data[i+2] = avg * 1.3;
        }
        targetCtx.putImageData(imgData, 0, 0);
        targetCtx.strokeStyle = 'rgba(0, 255, 204, 0.25)'; targetCtx.lineWidth = 1;
        for (let x = 0; x < w; x += 25) { targetCtx.beginPath(); targetCtx.moveTo(x, 0); targetCtx.lineTo(x, h); targetCtx.stroke(); }
        for (let y = 0; y < h; y += 25) { targetCtx.beginPath(); targetCtx.moveTo(0, y); targetCtx.lineTo(w, y); targetCtx.stroke(); }

      } else if (mode === 2) {
        for (let i = 0; i < data.length; i += 4) {
          const avg = (data[i] + data[i+1] + data[i+2]) / 3;
          data[i] = Math.min(255, avg * 1.3 + 40);
          data[i+1] = Math.min(255, avg * 0.9 + 25);
          data[i+2] = Math.min(255, avg * 0.8 + 20);
        }
        targetCtx.putImageData(imgData, 0, 0);

      } else if (mode === 3) {
        for (let i = 0; i < data.length; i += 4) {
          data[i] *= 1.1; data[i+1] *= 1.2; data[i+2] *= 1.3;
        }
        targetCtx.putImageData(imgData, 0, 0);
        targetCtx.fillStyle = 'rgba(0, 0, 0, 0.2)';
        for (let y = 0; y < h; y += 4) { targetCtx.fillRect(0, y, w, 2); }

      } else if (mode === 4) {
        for (let i = 0; i < data.length; i += 4) {
          const r = data[i], g = data[i+1], b = data[i+2];
          data[i] = r * 0.7;
          data[i+1] = g * 1.2;
          data[i+2] = b * 0.8;
        }
        targetCtx.putImageData(imgData, 0, 0);

      } else if (mode === 5) {
        for (let i = 0; i < data.length; i += 4) {
          const avg = (data[i] + data[i+1] + data[i+2]) / 3;
          const grain = (Math.random() - 0.5) * 40;
          data[i] = Math.min(255, Math.max(0, avg * 1.1 + grain + 10));
          data[i+1] = Math.min(255, Math.max(0, avg * 0.95 + grain));
          data[i+2] = Math.min(255, Math.max(0, avg * 0.8 + grain - 10));
        }
        targetCtx.putImageData(imgData, 0, 0);

      } else if (mode === 6) {
        for (let i = 0; i < data.length; i += 4) {
          let avg = (data[i]*0.3 + data[i+1]*0.59 + data[i+2]*0.11);
          avg = avg < 110 ? avg * 0.6 : Math.min(255, avg * 1.3);
          data[i] = data[i+1] = data[i+2] = avg;
        }
        targetCtx.putImageData(imgData, 0, 0);
      }

      targetCtx.strokeStyle = '#ffffff';
      targetCtx.lineWidth = 4;
      targetCtx.strokeRect(0, 0, w, h);
    }

    function onResults(results) {
      const W = canvas.width, H = canvas.height;
      const mirrorCanvas = document.createElement('canvas');
      mirrorCanvas.width = W; mirrorCanvas.height = H;
      const mCtx = mirrorCanvas.getContext('2d');
      mCtx.translate(W, 0); mCtx.scale(-1, 1);
      mCtx.drawImage(results.image, 0, 0, W, H);

      ctx.clearRect(0, 0, W, H);
      ctx.drawImage(mirrorCanvas, 0, 0);

      capturedFrames.forEach(frame => {
        ctx.drawImage(frame.image, frame.x, frame.y, frame.w, frame.h);
      });

      if (results.multiHandLandmarks && results.multiHandLandmarks.length === 2) {
        const h1 = results.multiHandLandmarks[0];
        const h2 = results.multiHandLandmarks[1];
        const p1 = { x: (1 - h1[8].x) * W, y: h1[8].y * H };
        const p2 = { x: (1 - h2[8].x) * W, y: h2[8].y * H };

        const boxX = Math.floor(Math.min(p1.x, p2.x));
        const boxY = Math.floor(Math.min(p1.y, p2.y));
        const boxW = Math.floor(Math.abs(p2.x - p1.x));
        const boxH = Math.floor(Math.abs(p2.y - p1.y));

        if (boxW > 60 && boxH > 60) {
          const previewCanvas = document.createElement('canvas');
          previewCanvas.width = boxW; previewCanvas.height = boxH;
          const pCtx = previewCanvas.getContext('2d');
          pCtx.drawImage(mirrorCanvas, boxX, boxY, boxW, boxH, 0, 0, boxW, boxH);

          const activeStyleIndex = selectedFilter === 'auto' ? capturedFrames.length : selectedFilter;
          applyFilterToContext(pCtx, boxW, boxH, activeStyleIndex);
          ctx.drawImage(previewCanvas, boxX, boxY);

          const pinch1 = getDistance(h1[4], h1[8]) < 0.05;
          const pinch2 = getDistance(h2[4], h2[8]) < 0.05;

          if ((pinch1 || pinch2) && !isPinching && !cooldown) {
            isPinching = true; cooldown = true;
            capturedFrames.push({ image: previewCanvas, x: boxX, y: boxY, w: boxW, h: boxH });
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.fillRect(boxX, boxY, boxW, boxH);
            setTimeout(() => { cooldown = false; }, 1000);
          } else if (!pinch1 && !pinch2) { isPinching = false; }
        }
      }
    }

    function undoLast() { capturedFrames.pop(); }
    function clearFrames() { capturedFrames = []; }
    function downloadPoster() {
      const link = document.createElement('a');
      link.download = `poster-${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
    hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });
    hands.onResults(onResults);

    const camera = new Camera(video, {
      onFrame: async () => { await hands.send({ image: video }); },
      width: 1280, height: 720
    });
    camera.start();
  </script>
</body>
</html>
